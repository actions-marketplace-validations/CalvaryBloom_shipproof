name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Verify package contents
        if: matrix.node-version == 22
        run: pnpm pack --dry-run

  action:
    name: GitHub Action smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run ShipProof action
        id: shipproof
        uses: ./
        with:
          fail-on-issues: false

      - name: Verify action outputs
        shell: bash
        env:
          SHIPPROOF_SCORE: ${{ steps.shipproof.outputs.score }}
          SHIPPROOF_FAILED: ${{ steps.shipproof.outputs.failed }}
        run: |
          test "$SHIPPROOF_SCORE" = "100"
          test "$SHIPPROOF_FAILED" = "0"
