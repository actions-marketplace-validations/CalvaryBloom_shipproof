name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What release-readiness problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show the command and output you would like to use.
    validations:
      required: true
  - type: dropdown
    id: ecosystem
    attributes:
      label: Primary ecosystem
      options: [All, Node.js, Python, Rust, Go, Other]
    validations:
      required: true
